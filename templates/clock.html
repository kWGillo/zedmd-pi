{% extends "base.html" %}
{% block title %}Orologio{% endblock %}

{% block content %}

<section class="card">
  <h2>Aspetto dell'orologio</h2>
  <form method="post" action="{{ url_for('api_clock') }}">

    <div class="row2">
      <div>
        <label for="time_color">Colore dell'ora</label>
        <div class="color-row">
          <input type="color" id="time_color" name="time_color" value="{{ cfg.clock.time_color }}">
          <span class="mono" id="time_color_hex">{{ cfg.clock.time_color }}</span>
        </div>
      </div>
      <div>
        <label for="date_color">Colore della data</label>
        <div class="color-row">
          <input type="color" id="date_color" name="date_color" value="{{ cfg.clock.date_color }}">
          <span class="mono" id="date_color_hex">{{ cfg.clock.date_color }}</span>
        </div>
      </div>
    </div>

    <div class="preview" id="preview">
      <span id="pv_time" style="color: {{ cfg.clock.time_color }}">12:34</span>
      <span id="pv_date" style="color: {{ cfg.clock.date_color }}">LUN 18/08</span>
    </div>

    <label for="language">Lingua dei giorni della settimana</label>
    <select id="language" name="language">
      {% for code, name in languages %}
      <option value="{{ code }}" {{ 'selected' if cfg.clock.language == code }}>{{ name }}</option>
      {% endfor %}
    </select>

    <label class="check">
      <input type="checkbox" name="format_24h" {{ 'checked' if cfg.clock.format_24h }}>
      Formato 24 ore (se disattivato: 12 ore con indicatore AM/PM)
    </label>

    <label class="check">
      <input type="checkbox" name="show_date" {{ 'checked' if cfg.clock.show_date }}>
      Mostra la data
    </label>

    <label class="check">
      <input type="checkbox" name="blink_colon" {{ 'checked' if cfg.clock.blink_colon }}>
      Due punti lampeggianti
    </label>

    <button type="submit">Salva</button>
  </form>
</section>

<script>
function bind(id, hexId, previewId) {
  const input = document.getElementById(id);
  input.addEventListener('input', () => {
    document.getElementById(hexId).textContent = input.value;
    document.getElementById(previewId).style.color = input.value;
  });
}
bind('time_color', 'time_color_hex', 'pv_time');
bind('date_color', 'date_color_hex', 'pv_date');
</script>
{% endblock %}
