# =========================================================================
#  DMD - assorbimento istantaneo
#  Manda al pannello quanto sta tirando la casa adesso, in watt.
# =========================================================================
#
#  COME SI USA:  seleziona **tutto questo file** e incollalo in
#
#      Impostazioni -> Automazioni e scene -> Crea automazione
#      -> «Crea nuova automazione» -> i tre puntini in alto a destra
#      -> «Modifica in YAML» -> cancella quello che c'e' -> incolla -> Salva.
#
#  Un file, una automazione: non c'e' niente da ritagliare e i commenti si
#  possono incollare insieme al resto, Home Assistant li ignora.
#
#  GLI ALTRI FILE, accanto a questo:
#      dmd_energia_accumulo.yaml        la carica della batteria, in percento
#      dmd_energia_giorno_e_sera.yaml   i due a turno, sullo stesso pannello
#      dmd_energia_prova.yaml           uno script per capire dove si inceppa
#
#  Serve **uno solo** fra questo, l'accumulo e il giorno-e-sera: il DMD colora
#  con le soglie del tipo scelto nella pagina, una alla volta.
#
#  ------------------------------------------------------------------------
#  DA CAMBIARE PRIMA DI SALVARE
#
#  L'entita':  sensor.consumo_casa , qui sotto in due punti (la condizione e
#  il payload). Se la tua si chiama cosi', non c'e' niente da toccare.
#  Altrimenti: Strumenti per sviluppatori -> Stati -> cerca «consumo» o
#  «power».
#
#  E sul DMD: pagina Energia -> tipo **Potenza**, unita' «W», e le tre soglie
#  (da qui giallo, da qui rosso, potenza dell'impianto). Poi si accende il
#  servizio nella pagina Servizi, o da qui con  switch.dmd_energia.
#
#  ------------------------------------------------------------------------
#  PERCHE' OGNI TRENTA SECONDI E NON A OGNI CAMBIO
#
#  Un sensore di potenza cambia a ogni lettura, cioe' ogni due secondi. Un
#  `platform: state` nudo pubblicherebbe per sempre a quel ritmo: traffico
#  inutile sul broker e un numero che balla, perche' 1250 e 1248 sono lo
#  stesso dato scritto due volte. Due volte al minuto e' gia' piu' spesso di
#  quanto serva a chi passa in corridoio.
#
#  ------------------------------------------------------------------------
#  SE IL NUMERO NON COMPARE
#
#  - il servizio Energia e' acceso?  (pagina Servizi, o switch.dmd_energia)
#  - il topic e' lo stesso nei due posti?  (pagina Energia del DMD)
#  - la pagina Energia dice «non e' ancora arrivato niente»? il problema e'
#    qui, in Home Assistant: prova  dmd_energia_prova.yaml
#  - dice «ultimo valore di N minuti fa»? l'automazione ha pubblicato una
#    volta e poi ha smesso: guarda le sue tracce
#  - sul pannello ci sono due trattini: il DMD e' vivo e sta dicendo che non
#    gli arriva piu' niente. E' il comportamento giusto, non un guasto
#
# =========================================================================

alias: DMD - assorbimento istantaneo
description: >-
  Manda al pannello il consumo di adesso, due volte al minuto.
  Le soglie e i colori stanno sul DMD, non qui.
mode: single
max_exceeded: silent
trigger:
  - platform: time_pattern
    seconds: /30
  # E una volta subito, quando Home Assistant riparte: senza questa riga, dopo
  # un riavvio il pannello resta con i due trattini fino al prossimo mezzo
  # minuto.
  - platform: homeassistant
    event: start
condition:
  # Un sensore non disponibile non si pubblica: meglio che il DMD mostri i due
  # trattini -- che vogliono dire «non lo so» -- di un numero vecchio o di uno
  # zero inventato qui.
  - condition: template
    value_template: >-
      {{ states('sensor.consumo_casa') not in
         ['unknown', 'unavailable', 'none', ''] }}
action:
  - service: mqtt.publish
    data:
      topic: dmd/energia
      # `| round(0)` perche' sul pannello i decimali della potenza non si
      # leggono e fanno ballare la riga.
      payload: "{{ states('sensor.consumo_casa') | float(0) | round(0) }}"
