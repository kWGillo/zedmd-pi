# =========================================================================
#  DMD Controller 9.8 - ON AIR dal sensore della porta
# =========================================================================
#
#  Il DMD non sa che esiste una porta. Sa solo se e' in onda o no, e te lo
#  chiede con un interruttore:
#
#      switch.dmd_in_onda
#
#  Questa automazione ci rispecchia sopra il tuo sensore. Il sensore lo
#  scegli qui, in Home Assistant, dove stanno gia' tutte le altre decisioni
#  di casa; il DMD resta ignorante di proposito. Il giorno che cambi il
#  sensore, o vuoi che la porta della cabina conti solo di sera, cambi
#  **questo file** e basta.
#
#  ------------------------------------------------------------------------
#  COME SI INSTALLA
#
#  1. Accendi il servizio OnAir sul DMD
#     Pagina Servizi -> OnAir. Nasce spento.
#     Da li' scegli anche il testo (predefinito «ON AIR») e il suono.
#
#  2. Controlla come si chiamano le due entita'
#     Strumenti per sviluppatori -> Stati, cerca «in_onda».
#     Se il tuo DMD ha un node_id diverso da `dmd`, l'interruttore si
#     chiamera' diversamente: correggilo nelle due righe segnate sotto.
#
#  3. Crea l'automazione
#     Impostazioni -> Automazioni e scene -> Crea automazione
#     -> in alto a destra i tre puntini -> Modifica in YAML
#     -> incolla tutto quello che c'e' sotto la riga AUTOMAZIONE
#     -> Salva.
#
#  4. La prova
#     Chiudi la porta. Sul pannello deve comparire ON AIR, e da li' in poi
#     l'orologio porta un trattino rosso in alto. Apri la porta: sparisce.
#
#  ------------------------------------------------------------------------
#  DA CAMBIARE: due righe, marcate con  <<< IL TUO SENSORE
#
#  Attenzione al verso. Un sensore con device_class `door` sta a:
#      on  = porta APERTA
#      off = porta CHIUSA
#  Quindi «in onda» corrisponde a `off`. Se il tuo sensore e' cablato al
#  contrario, scambia `off` con `on` nella riga del template.
#
#  ------------------------------------------------------------------------
#  PERCHE' C'E' IL TERZO INNESCO
#
#  Se il Pi si riavvia mentre la porta e' chiusa, al ritorno deve sapere che
#  e' ancora in onda; e se nel frattempo la porta si e' aperta, non deve
#  credere il contrario. Il DMD annuncia da se' quando torna disponibile,
#  pubblicando `online` su `dmd/availability`: quello e' l'innesco esatto per
#  riallineare, e non richiede di sorvegliare niente.
#
#  L'azione non guarda **quale** innesco e' scattato: rilegge sempre lo stato
#  vero del sensore e lo riafferma. Cosi' e' ripetibile senza danni, e un
#  innesco perso si corregge al successivo.
#
#  Se il sensore e' `unavailable` -- batteria scarica, gateway giu' -- il
#  template cade su «non in onda». E' la scelta prudente: un ON AIR acceso
#  per sempre per colpa di una pila e' peggio di un ON AIR che manca.
#
# =========================================================================
#  AUTOMAZIONE
# =========================================================================

alias: DMD - ON AIR dal sensore della porta
description: >-
  Rispecchia il sensore della porta sull'interruttore In onda del DMD.
  Porta chiusa = in onda.
mode: queued
max: 5

triggers:
  # Qualunque cambio del sensore, nei due versi.
  - trigger: state
    entity_id: binary_sensor.porta_studio        # <<< IL TUO SENSORE
    not_from:
      - unknown

  # Il DMD e' tornato disponibile: gli si ridice com'e' messa la porta.
  - trigger: mqtt
    topic: dmd/availability
    payload: online
    id: riallinea

  # E dopo un riavvio di Home Assistant.
  - trigger: homeassistant
    event: start
    id: riallinea

conditions: []

actions:
  # Solo quando si riallinea si aspetta qualche secondo: il DMD ha appena
  # detto «online» e deve finire di iscriversi ai propri topic. Sul cambio
  # della porta l'attesa e' zero, che e' l'unico caso in cui si nota.
  - delay: >-
      {{ 3 if (trigger.id | default('')) == 'riallinea' else 0 }}

  # Nella riga qui sotto c'e' la seconda occorrenza  <<< IL TUO SENSORE
  - action: >-
      {{ 'switch.turn_on'
         if is_state('binary_sensor.porta_studio', 'off')
         else 'switch.turn_off' }}
    target:
      entity_id: switch.dmd_in_onda
